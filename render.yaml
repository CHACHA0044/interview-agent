# Render Infrastructure Specification for Interview Agent Backend
# Single-container deployment running Gateway, Agent, and AI Intelligence over loopback HTTP
services:
  - type: web
    name: interview-agent-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: fake
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,https://interview-agent-eight-rouge.vercel.app
